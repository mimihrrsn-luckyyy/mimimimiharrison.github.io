<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Poem Title</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:url("pinkfab.jpg") center/cover fixed;
    font-family:"Cormorant Garamond", serif;
    color:#4d3b2d;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:70px 20px;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle,
        transparent 45%,
        rgba(0,0,0,.22) 100%);
    pointer-events:none;
}

.paper{

    position:relative;
    width:min(760px,95%);
    background:rgba(255,250,242,.92);

    padding:70px 65px;

    border-radius:6px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.18),
        0 0 30px rgba(255,255,255,.15);

    backdrop-filter:blur(3px);

}

.paper::before{

    content:"";
    position:absolute;
    inset:18px;
    border:1px solid rgba(165,132,80,.28);
    pointer-events:none;

}

h1{

    font-family:"Pinyon Script", cursive;
    font-size:4.8rem;
    text-align:center;
    margin-bottom:18px;

    background:linear-gradient(
        to bottom,
        #fff8d6,
        #f4d36a,
        #c49427,
        #fff2af
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

}

.divider{

    width:120px;
    height:1px;
    background:#c8aa74;
    margin:0 auto 40px;

}

.poem{

    white-space:pre-wrap;

    font-size:1.28rem;
    line-height:2;

    letter-spacing:.02em;

}

.back{

    display:block;
    margin-top:55px;

    text-align:center;

    text-decoration:none;

    color:#7d5a3b;

    font-size:1rem;

    transition:.25s;

}

.back:hover{

    letter-spacing:2px;

}

@media(max-width:700px){

.paper{
padding:45px 30px;
}

h1{
font-size:3.3rem;
}

.poem{
font-size:1.08rem;
line-height:1.8;
}

}

</style>

</head>
<body>

<div class="paper">

<h1>Poem Title</h1>

<div class="divider"></div>

<div class="poem">

Paste your poem here.

Keep blank lines between stanzas.

Everything
will preserve
its formatting.

</div>

<a class="back" href="gallery.html">← Return to Summer Poetry</a>

</div>

</body>
</html>
