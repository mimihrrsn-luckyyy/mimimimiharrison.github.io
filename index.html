<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Homepage</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Ballet&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almendra+Display&family=Castoro+Titling&family=Cinzel+Decorative:wght@400;700;900&family=Dr+Sugiyama&family=Eagle+Lake&family=Ingrid+Darling&family=Jacques+Francois+Shadow&family=Kapakana:wght@300..400&family=Luxurious+Script&family=Mr+Bedfort&family=Playfair+Display+SC:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Puppies+Play&family=Rock+3D&family=Special+Elite&family=Stalemate&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:"Special Elite", system-ui;
      background:
        url("scmp_bird_and_crane.jpg") center/cover no-repeat fixed;
      min-height:100vh;
      overflow-x:hidden;
    }

    @keyframes drift{
      from{
        transform:translateY(0px);
      }
      to{
        transform:translateY(100px);
      }
    }

    nav{
      width:100%;
      padding:24px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      backdrop-filter:blur(8px);
    }

    .logo{
      font-size:1.4rem;
      font-weight:800;
      letter-spacing:2px;
    }

    nav ul{
      display:flex;
      gap:28px;
      list-style:none;
    }

    nav a{
      color:white;
      text-decoration:none;
      opacity:0.8;
      transition:0.3s;
    }

    nav a:hover{
      opacity:1;
    }

    .hero{
      min-height:85vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:40px;
    }

    .hero h1{
      font-family: "Mr Bedfort", cursive;
      font-size: clamp(4rem, 9vw, 7rem);
      letter-spacing: 2px;
      color: #F7B5DB;
    }
    
    
    .hero p{
      font-family: "Mr Bedfort", cursive;
      color: #F7B5DB;
      max-width:700px;
      
      font-size: 2.3rem;
      
      line-height: 1.3;
      letter-spacing: 2px;
      
      margin-bottom:40px;
    }

    .buttons{
      display:flex;
      gap:20px;
      flex-wrap:wrap;
    }


  .btn{
    border-radius:4px;
    font-family:"Special Elite", monospace;
    letter-spacing:1px;

    border:2px solid rgba(255,240,220,0.4);

    background:rgba(245,229,201,0.18);
    color:#FFFFE8;

    box-shadow:6px 6px 0px rgba(0,0,0,0.25);

    backdrop-filter:blur(4px);
  }

  .btn:hover{
    transform:translate(-2px,-2px);
  }

.cards{
  width:100%;

  padding:40px 8% 100px;

  display:grid;

  grid-template-columns:repeat(3, 1fr);

  gap:40px;

  justify-items:center;

  align-items:start;
}

 .card{
    background: url("oldpost.png") no-repeat center;
    background-size: 100% 100%;

    width: 260px;
    height: 160px;

    padding-top: 95px;
    padding-left: 85px;
    padding-right: 60px;

    border:none;
    box-shadow:none;

    display:flex;
    flex-direction:column;

    text-decoration:none;
  }


  .card h3{
    font-family:"Mr Bedfort", cursive;

    color:#8F0425;

    margin-bottom:15px;

    font-size:2.3rem;

    letter-spacing:1px;
  }


  .card p{
    font-family:"Special Elite", monospace;

    color:#8F0425;

    line-height:1.7;

    font-size:1rem;
  }

    footer{
      font-family: "Mr Bedfort", cursive;
      color: #FFFFE8;
      text-align:center;
      padding:40px;
      opacity:0.5;
      font-size:0.9rem;
    }
    
  </style>
</head>

<body>

  <nav>
    <div class="logo">MY SPACE</div>

    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">Gallery</a></li>
      <li><a href="#">goo goo ga ga</a></li>
    </ul>
  </nav>

  <section class="hero">
    <h1>Mimi Harrison</h1>

    <p>
     thoughts, plans, schemes, journals
    </p>

    <div class="buttons">
      <a class="btn primary" href="#">Explore</a>
      <a class="btn secondary" href="#">GitHub</a>
    </div>
  </section>

  <section class="cards">

    <div class="card">
      <h3>Projects</h3>
      <p>
        things.
      </p>
    </div>

    <div class="card">
      <h3>pics n things</h3>
      <p>
        pics.
      </p>
    </div>

    <div class="card">
      <h3>Interests</h3>
      <p>
        who knows.
      </p>
    </div>

  </section>

  <footer>
    © 2026 My Homepage
  </footer>

</body>
</html>
