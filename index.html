<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Homepage</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Ballet&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:
        url("scmp_bird.JPG") center/cover no-repeat fixed;
      min-height:100vh;
      overflow-x:hidden;
    }

    @keyframes drift{
      from{
        transform:translateY(0px);
      }
      to{
        transform:translateY(100px);
      }
    }

    nav{
      width:100%;
      padding:24px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      backdrop-filter:blur(8px);
    }

    .logo{
      font-size:1.4rem;
      font-weight:800;
      letter-spacing:2px;
    }

    nav ul{
      display:flex;
      gap:28px;
      list-style:none;
    }

    nav a{
      color:white;
      text-decoration:none;
      opacity:0.8;
      transition:0.3s;
    }

    nav a:hover{
      opacity:1;
    }

    .hero{
      min-height:85vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:40px;
    }

    .hero h1{
      font-family: "Playfair Display SC", serif;
      font-size: clamp(3rem, 8vw, 6rem);
      letter-spacing: 1px;
    }

    
    .hero h1{
      color: #F7B5DB;
    }
    
    
    .hero p{
      font-family: "Playfair Display SC", serif;
      color: #F7B5DB;
      max-width:700px;
      font-size:1.2rem;
      line-height:1.8;
      opacity:0.85;
      margin-bottom:40px;
    }

    .buttons{
      display:flex;
      gap:20px;
      flex-wrap:wrap;
    }

    .btn{
      padding:14px 28px;
      border-radius:999px;
      text-decoration:none;
      font-weight:600;
      transition:0.3s ease;
    }

    .primary{
      background:white;
      color:black;
    }

    .primary:hover{
      transform:translateY(-3px);
      box-shadow:0 10px 30px rgba(255,255,255,0.2);
    }

    .secondary{
      border:1px solid rgba(255,255,255,0.3);
      color:white;
      backdrop-filter:blur(10px);
    }

    .secondary:hover{
      background:rgba(255,255,255,0.08);
      transform:translateY(-3px);
    }

    .cards{
      width:100%;
      padding:40px 8% 100px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:30px;
    }

    .card{
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:24px;
      padding:30px;
      backdrop-filter:blur(12px);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-8px);
      background:rgba(255,255,255,0.09);
    }

    .card h3{
      font-family: "Playfair Display SC", serif;
      color: #7df9ff;
      margin-bottom:15px;
      font-size:1.3rem;
    }

    .card p{
      opacity:0.8;
      line-height:1.7;
    }

    footer{
      text-align:center;
      padding:40px;
      opacity:0.5;
      font-size:0.9rem;
    }
  </style>
</head>

<body>

  <nav>
    <div class="logo">MY SPACE</div>

    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">Gallery</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <section class="hero">
    <h1>It's Mimiiiii</h1>

    <p>
     Me!
    </p>

    <div class="buttons">
      <a class="btn primary" href="#">Explore</a>
      <a class="btn secondary" href="#">GitHub</a>
    </div>
  </section>

  <section class="cards">

    <div class="card">
      <h3>Projects</h3>
      <p>
        things.
      </p>
    </div>

    <div class="card">
      <h3>pics n things</h3>
      <p>
        pics.
      </p>
    </div>

    <div class="card">
      <h3>Interests</h3>
      <p>
        who knows.
      </p>
    </div>

  </section>

  <footer>
    © 2026 My Homepage
  </footer>

</body>
</html>
