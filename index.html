    body{

      min-height:100vh;

    @keyframes drift{
      from{
        transform:translateY(0px);
      }
      to{
        transform:translateY(100px);
      }

    nav{

      padding:24px 8%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      backdrop-filter:blur(8px);

    .logo{

      font-weight:800;
      letter-spacing:2px;
    }

    nav ul{
      display:flex;
      gap:28px;
      list-style:none;
    }

    nav a{
      color:white;
      text-decoration:none;
      opacity:0.8;
      transition:0.3s;
    }

    nav a:hover{
      opacity:1;
    }

    .hero{
      min-height:85vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:40px;

.hero h1{
  font-family:"Pinyon Script", cursive;

  font-size: clamp(5rem, 10vw, 9rem);

  font-weight:400;

  letter-spacing:2px;

  background: linear-gradient(
    to bottom,
    #fff8d6 0%,
    #ffe88a 18%,
    #f3cf58 38%,
    #c89a2b 55%,
    #fff0a8 72%,
    #a97816 100%
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:

    /* glossy top highlight */
    0px -1px 0px rgba(255,255,220,0.9),

    /* soft puffy thickness */
    1px 1px 0px #d4a93a,
    2px 2px 0px #c18d22,
    3px 3px 0px #9f6f12,

    /* soft outer bloom */
    0 0 8px rgba(255,230,120,0.55),
    0 0 18px rgba(255,220,90,0.35),

    /* cinematic shadow */
    5px 5px 12px rgba(0,0,0,0.22);

  filter: blur(0.25px);

  transform: rotate(-1deg);
}
    

.hero p{
  font-family:"Pinyon Script", cursive;
  color: #F7B5DB;

  font-size: 2.3rem;
  line-height: 1.3;
  letter-spacing: 2px;

  background: linear-gradient(
    to bottom,
    #ffd1e8 0%,
    #f7b5db 40%,
    #d87aa7 100%
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:
    0px -1px 0px rgba(255,240,250,0.9),
    1px 1px 0px rgba(150,60,110,0.25),
    2px 2px 4px rgba(0,0,0,0.15),

    0 0 8px rgba(255,180,220,0.35);
}

.hero p{
  text-shadow:
    0px -1px 0px rgba(255,245,250,0.9),
    1px 1px 0px rgba(160,80,120,0.25),
    2px 2px 0px rgba(120,50,90,0.2),
    0 0 10px rgba(255,170,210,0.35);
}
    

.cards{
  width:100%;
  margin-top:-140px;
  padding:60px 8% 100px;

  display:grid;

  grid-template-columns:repeat(3, auto);

  gap:40px;

  justify-content:center;

  align-items:start;
}
    
.card{
  display:block;
  text-decoration:none;
  color:inherit;

  background: url("envelope.png") no-repeat center;
  background-size: 100% 100%;

  width:504px;
  height:312px;

  padding-top:90px;
  padding-left:70px;
  padding-right:45px;
  justify-content:center;
}

.card{
  cursor:pointer;
  transition: transform 0.2s ease, filter 0.2s ease;
}

.card:hover{
  transform: translateY(-4px) rotate(-0.5deg);
  filter: brightness(1.05);
}

.card:active{
  transform: translateY(0px) scale(0.98);
}
    
@media (max-width: 1400px){
  .cards{
    grid-template-columns:repeat(2, 1fr);
  }
}

@media (max-width: 900px){
  .cards{
    grid-template-columns:1fr;
  }
}



  .card h3{
