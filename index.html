      overflow-x:hidden;

    @keyframes drift{
      from{
        transform:translateY(0px);
      }
      to{
        transform:translateY(100px);
      }
    }

    nav{
      width:100%;
      padding:24px 8%;

      backdrop-filter:blur(8px);

    }

    nav ul{
      display:flex;
      gap:28px;
      list-style:none;
    }

    nav a{
      color:white;
      text-decoration:none;
      opacity:0.8;
      transition:0.3s;
    }

    nav a:hover{
      opacity:1;
    }

    .hero{
      min-height:85vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:40px;
    }

  
.hero h1{
  font-family:"Pinyon Script", cursive;

  font-size: clamp(5rem, 10vw, 9rem);
  font-weight:400;

  letter-spacing:0.5px;

  background: linear-gradient(
    to bottom,
    #fff8d6 0%,
    #ffe88a 18%,
    #f3cf58 38%,
    #c89a2b 55%,
    #fff0a8 72%,
    #a97816 100%
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;

  text-shadow:

    /* glossy top highlight */
    0 -1px 0 rgba(255,255,220,0.9),

    /* soft golden depth */
    1px 1px 2px rgba(212,169,58,.45),
    2px 2px 4px rgba(193,141,34,.25),

    /* warm bloom */
    0 0 10px rgba(255,230,120,.55),
    0 0 24px rgba(255,220,90,.35),
    0 0 50px rgba(255,210,90,.18),

    /* cinematic shadow */
    4px 4px 10px rgba(0,0,0,.18);

  transform: rotate(-1deg);

  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.hero p{
  font-family:"Pinyon Script", cursive;

  font-size: 2.3rem;
  line-height: 1.3;
  letter-spacing: 0.5px;

  background: linear-gradient(
    to bottom,
    #ffd1e8 0%,
    #f7b5db 40%,
    #d87aa7 100%
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;

  text-shadow:
    0 -1px 0 rgba(255,245,250,.9),

    /* soft pink depth */
    1px 1px 2px rgba(160,80,120,.22),

    /* glow */
    0 0 8px rgba(255,180,220,.35),
    0 0 18px rgba(255,180,220,.22),

    /* subtle shadow */
    2px 2px 6px rgba(0,0,0,.12);

  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.hero p{
  text-shadow:
    0px -1px 0px rgba(255,245,250,0.9),
    1px 1px 0px rgba(160,80,120,0.25),
    2px 2px 0px rgba(120,50,90,0.2),
    0 0 10px rgba(255,170,210,0.35);
}
    

.cards{
  width: 100%;
  margin-top: -120px;
  padding: 60px 3% 60px;

  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 28px;

  justify-items: center;
  align-items: start;
}
    
.card{
  position: relative;

  width: 90%;
  max-width: 400px;
  aspect-ratio: 504 / 312;

  background: url("envelope.png") no-repeat center;
  background-size: 100% 100%;

  text-decoration: none;
  color: inherit;

  cursor: pointer;
  transition: transform 0.2s ease, filter 0.2s ease;
}

.card-content{
  text-align:center;
  position:absolute;

  /* moves text below the envelope midpoint */
  top:80%;
  left:50%;
  transform:translate(-50%, -50%);

  width:80%;
}
  
.card{
  cursor:pointer;
  transition: transform 0.2s ease, filter 0.2s ease;
}

.card:hover{
  transform: translateY(-4px) rotate(-0.5deg);
  filter: brightness(1.05);
}
  

.card:active{
  transform: translateY(0px) scale(0.98);
}
    
@media (max-width: 1400px){
  .cards{
    grid-template-columns:repeat(2, 1fr);
  }
}

@media (max-width: 900px){
  .cards{
    grid-template-columns:1fr;
  }
}



 .card h3{
  font-family:"Cormorant Garamond", serif;
  color:#8F0425;

  margin: 0 0 10px 0;

  font-size:1.5rem;

}


  .card p{

      opacity:0.5;
      font-size:0.9rem;
    }
    
  </style>
