<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    background:url("pinkfab.jpg") center/cover fixed;

    font-family:"Cormorant Garamond",serif;

    color:#5b4334;

    overflow-x:hidden;
}


/* SOFT DARKENING AROUND THE EDGES */

body::before{
    content:"";

    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle,
            transparent 45%,
            rgba(0,0,0,.22) 100%
        );

    pointer-events:none;
}


/* PAGE CONTAINER */

.wrapper{
    width:min(1200px,92%);

    margin:auto;

    padding:70px 0 100px;
}


/* TITLE */

.page-title{
    font-family:"Pinyon Script",cursive;

    font-size:clamp(5rem,10vw,9rem);

    font-weight:400;

    text-align:center;

    margin-bottom:45px;

    background:linear-gradient(
        to bottom,
        #fff8d6 0%,
        #ffe88a 18%,
        #f3cf58 38%,
        #c89a2b 55%,
        #fff0a8 72%,
        #a97816 100%
    );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-fill-color:transparent;

    text-shadow:
        0 -1px 0 rgba(255,255,220,.9),
        1px 1px 2px rgba(212,169,58,.45),
        2px 2px 4px rgba(193,141,34,.25),
        0 0 10px rgba(255,230,120,.55),
        0 0 24px rgba(255,220,90,.35),
        0 0 50px rgba(255,210,90,.18),
        4px 4px 10px rgba(0,0,0,.18);

    transform:rotate(-1deg);
}


/* =================================================
   PHOTO GRID
   ================================================= */

.photo-grid{

    display:grid;

    grid-template-columns:repeat(2, 1fr);

    gap:45px 35px;

    align-items:start;
}


/* PHOTO CARD */

.photo-card{
    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;
}


/* PHOTO FRAME */

.photo-frame{
    width:100%;

    padding:12px;

    background:rgba(255,249,241,.92);

    border:1px solid rgba(255,255,255,.5);

    box-shadow:
        0 20px 45px rgba(0,0,0,.18),
        inset 0 0 0 1px rgba(183,143,82,.18);

    backdrop-filter:blur(2px);
}


/* ACTUAL PHOTO */

.photo-frame img{
    width:100%;

    height:auto;

    display:block;

    object-fit:cover;

    border:1px solid rgba(91,67,52,.15);

    box-shadow:
        0 4px 12px rgba(0,0,0,.12);

    transition:.4s;
}


/* HOVER */

.photo-frame img:hover{
    transform:scale(1.01);
}


/* =================================================
   OPTIONAL CAPTION
   ================================================= */

.caption-box{
    width:calc(100% - 40px);

    margin-top:0;

    padding:25px 35px;

    background:rgba(255,249,241,.88);

    border:1px solid rgba(255,255,255,.35);

    border-top:none;

    box-shadow:
        0 15px 30px rgba(0,0,0,.10),
        inset 0 0 0 1px rgba(183,143,82,.12);

    backdrop-filter:blur(2px);

    text-align:center;
}


.caption{
    font-size:1.15rem;

    line-height:1.6;

    font-style:italic;

    letter-spacing:.3px;

    color:#6b5040;
}


/* RETURN HOME */

.back{
    display:block;

    text-align:center;

    margin-top:60px;

    color:#f5ead1;

    letter-spacing:2px;

    text-decoration:none;

    font-size:.95rem;
}

.back:hover{
    opacity:.75;
}


/* =================================================
   MOBILE
   ================================================= */

@media(max-width:700px){

    .wrapper{
        padding:45px 0 80px;
    }

    .page-title{
        margin-bottom:30px;
    }

    /* ONE COLUMN ON PHONES */

    .photo-grid{
        grid-template-columns:1fr;

        gap:35px;
    }

    .photo-frame{
        padding:9px;
    }

    .caption-box{
        width:calc(100% - 25px);

        padding:20px 22px;
    }

    .caption{
        font-size:1.05rem;
    }

}

</style>
</head>
