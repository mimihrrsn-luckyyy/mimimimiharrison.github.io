<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Glossary</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    background:
        url("pinkfab.jpg") center/cover fixed;

    font-family:"Cormorant Garamond", serif;
    color:#5b4334;

    overflow-x:hidden;
}


/* HEADER */

header{
    text-align:center;

    padding-top:70px;
    padding-bottom:20px;
}

header h1{
  font-family:"Pinyon Script", cursive;

  font-size: clamp(5rem, 10vw, 9rem);

  font-weight:400;

  letter-spacing:2px;

  background: linear-gradient(
    to bottom,
    #fff8d6 0%,
    #ffe88a 18%,
    #f3cf58 38%,
    #c89a2b 55%,
    #fff0a8 72%,
    #a97816 100%
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:

    /* glossy top highlight */
    0px -1px 0px rgba(255,255,220,0.9),

    /* soft puffy thickness */
    1px 1px 0px #d4a93a,
    2px 2px 0px #c18d22,
    3px 3px 0px #9f6f12,

    /* soft outer bloom */
    0 0 8px rgba(255,230,120,0.55),
    0 0 18px rgba(255,220,90,0.35),

    /* cinematic shadow */
    5px 5px 12px rgba(0,0,0,0.22);

  filter: blur(0.25px);

  transform: rotate(-1deg);
}

header p{
    font-size:1rem;
    text-transform:uppercase;
    letter-spacing:.15em;

    opacity:.7;
}


/* GLOSSARY LAYOUT */

.glossary{
    width:min(1300px, 92%);
    margin:auto;

    padding:50px 0 100px;

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:55px;
}


/* EACH FORTUNE PAPER */

.fortune{
    position:relative;

    width:260px;

    transition:.3s ease;
}

.fortune:hover{
    transform:translateY(-6px) rotate(0deg) !important;
}


/* IMAGE */

.fortune img{
    width:100%;
    display:block;

    filter:
        drop-shadow(0 8px 18px rgba(70,45,20,.12));
}


/* TEXT ON PAPER */

.fortune-text{
    font-family:"Cormorant Garamond", cursive;
    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%, -50%);

    width:72%;

    text-align:center;

    color:#303D6B;
}


/* WORD */

.fortune-text h2{
    font-family:"Cormorant Garamond", cursive;
    font-size:1rem;
    font-weight:normal;

    color:#303D6B;

    margin-bottom:12px;
}


/* DEFINITION */

.fortune-text p{
    font-size:0.75rem;
    line-height:1.5;
    letter-spacing:.02em;
}


/* SCATTERED PAPERS */

.fortune:nth-child(odd){
    transform:rotate(-2deg);
}

.fortune:nth-child(even){
    transform:rotate(2deg);
}

.fortune:nth-child(3n){
    transform:rotate(-4deg);
}

.fortune:nth-child(5n){
    transform:rotate(1deg);
}



<header>
    <h1>Glossary</h1>
    <p>book werds i didn't know or liked</p>
</header>


<section class="glossary">


    <!-- WORD 1 -->

    <div class="fortune">

        <img src="fort1.png" alt="fortune paper">

        <div class="fortune-text">
            <h2>ephemeral</h2>
            <p>lasting for only a short time</p>
        </div>

    </div>



    <!-- WORD 2 -->

    <div class="fortune">

        <img src="fort1.png" alt="fortune paper">

        <div class="fortune-text">
            <h2>verdant</h2>
            <p>green with rich plant life</p>
        </div>

    </div>



    <!-- WORD 3 -->

    <div class="fortune">

        <img src="fort1.png" alt="fortune paper">

        <div class="fortune-text">
            <h2>sonder</h2>
            <p>the realization that everyone lives a life as vivid as your own</p>
        </div>

    </div>



    <!-- WORD 4 -->

    <div class="fortune">

        <img src="fort1.png" alt="fortune paper">

        <div class="fortune-text">
            <h2>mellifluous</h2>
            <p>sweet and musical sounding</p>
        </div>

    </div>



    <!-- WORD 5 -->

    <div class="fortune">

        <img src="fort1.png" alt="fortune paper">

        <div class="fortune-text">
            <h2>halcyon</h2>
            <p>peaceful, nostalgic, idyllic</p>
        </div>

    </div>



    <!-- WORD 6 -->

    <div class="fortune">

        <img src="fort1.png" alt="fortune paper">

        <div class="fortune-text">
            <h2>luminous</h2>
            <p>softly glowing or radiant</p>
        </div>

    </div>


</section>

</body>
</html>
