<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Summer Reading</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Special+Elite&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;

      background:
        linear-gradient(rgba(10,10,10,0.22), rgba(10,10,10,0.22)),
        url("whitepapercrump.jpg") center/cover fixed;

      font-family:"Special Elite", monospace;

      color:#8F0425;

      padding:80px 20px;
    }

    .page{
      width:min(900px, 100%);
      margin:auto;
    }

    h1{
      font-family:"Great Vibes", cursive;

      font-size:5rem;
      font-weight:400;

      text-align:center;

      margin-bottom:70px;

      color:#ffd7e8;

      text-shadow:
        0 0 10px rgba(255,220,230,0.45),
        0 0 30px rgba(255,190,220,0.25);
    }

    .subtitle{
      text-align:center;

      font-size:1rem;
      letter-spacing:1px;

      margin-top:-45px;
      margin-bottom:55px;

      color:#8F0425;

      opacity:0.75;
    }

.book{
  display:flex;

  margin-bottom:55px;
  padding:24px;

  background: url("tornpiece.png") center/cover no-repeat;

  border-radius:0;

  position:relative;
}
    .book img{
      width:130px;
      margin-left:75px;

      border-radius:3px;

      box-shadow:
        0 8px 18px rgba(0,0,0,0.35);
    }

    .info h2{
      font-family:"Great Vibes", cursive;

      font-size:2.7rem;
      font-weight:400;
      margin-left:78px;

      color:#8F0425;

      margin-bottom:10px;

      text-shadow:
        0 0 8px rgba(255,220,230,0.25);
    }

    .author{
      opacity:0.72;

      margin-bottom:16px;

      letter-spacing:1px;
    }

    .notes{
      line-height:1.7;

      color:#8F0425;

      opacity:0.88;
    }

    .home{
      display:block;

      width:fit-content;

      margin:70px auto 0;

      color:#ffe6ef;

      text-decoration:none;

      font-size:1rem;

      opacity:0.75;
    }

    .home:hover{
      opacity:1;
    }

    @media (max-width:700px){

      .book{
        flex-direction:column;
        align-items:center;
        text-align:center;
      }

      .book img{
        width:170px;
      }

    }

  </style>
</head>

<body>

  <div class="page">

    <h1>Summer Reading</h1>
    <p class="subtitle"></p>

    <div class="book">

      <img src="book1.jpg" alt="Book Cover">

      <div class="info">
        <h2>The Bell Jar</h2>

        <div class="author">
          Sylvia Plath
        </div>

        <div class="notes">
          sad girls in summer etc etc
        </div>
      </div>

    </div>

    <div class="book">

      <img src="book2.jpg" alt="Book Cover">

      <div class="info">
        <h2>Norwegian Wood</h2>

        <div class="author">
          Haruki Murakami
        </div>

        <div class="notes">
          jazz cigarettes melancholy probably
        </div>
      </div>

    </div>

    <div class="book">

      <img src="book3.jpg" alt="Book Cover">

      <div class="info">
        <h2>On the Road</h2>

        <div class="author">
          Jack Kerouac
        </div>

        <div class="notes">
          american summer drifting feeling
        </div>
      </div>

    </div>

    <a class="home" href="index.html">
      ← back home
    </a>

  </div>

</body>
</html>
