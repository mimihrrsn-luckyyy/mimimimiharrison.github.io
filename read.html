<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Summer Reading</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pinyon+Script&family=Special+Elite&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;

      background:
        linear-gradient(rgba(10,10,10,0.22), rgba(10,10,10,0.22)),
        url("wood.jpg") center/cover fixed;

      font-family:"Special Elite", monospace;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:40px 20px;
    }

    .page{
      width:min(950px, 100%);
      text-align:center;
    }

    h1{
      font-family:"Great Vibes", cursive;

      font-size:5rem;
      font-weight:400;

      margin-bottom:20px;

      color:#ffd7e8;

      text-shadow:
        0 0 10px rgba(255,220,230,0.45),
        0 0 30px rgba(255,190,220,0.25);
    }

    .subtitle{
      font-size:0.9rem;
      letter-spacing:2px;

      color:#8F0425;

      margin-bottom:70px;
    }

    .options{
      display:flex;
      gap:40px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .card{
      width:320px;

      padding:40px 30px;

      background:url("wood.png") center/cover no-repeat;

      text-decoration:none;

      transition:
        transform 0.25s ease,
        filter 0.25s ease;
    }

    .card:hover{
      transform:translateY(-6px) scale(1.02);
      filter:brightness(1.03);
    }

    .card h2{
      font-family:"Great Vibes", cursive;

      font-size:2.8rem;
      font-weight:400;

      color:#8F0425;

      margin-bottom:18px;

      text-shadow:
        0 0 8px rgba(255,220,230,0.25);
    }

    .card p{
      font-size:0.8rem;
      line-height:1.8;

      color:#8F0425;
    }

    .home{
      display:inline-block;

      margin-top:70px;

      color:#ffe6ef;

      text-decoration:none;

      font-size:1rem;

      opacity:0.75;

      transition:opacity 0.2s ease;
    }

    .home:hover{
      opacity:1;
    }

    @media (max-width:700px){

      h1{
        font-size:3.8rem;
      }

      .options{
        gap:25px;
      }

      .card{
        width:100%;
        max-width:360px;
      }

    }

  </style>
</head>

<body>

  <div class="page">

    <h1>Summer Reading</h1>

    <p class="subtitle">
      choose
    </p>

    <div class="options">

      <a class="card" href="readinglist.html">

        <h2>Reading List</h2>

        <p>
          books to read
        </p>

      </a>

      <a class="card" href="glossary.html">

        <h2>Glossary</h2>

        <p>
          words i didn't know, words i liked, words that confuse me.
        </p>

      </a>

    </div>

    <a class="home" href="index.html">
      ← back home
    </a>

  </div>

</body>
</html>
