<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Summer Diary</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:url("pinkfab.jpg") center/cover fixed;
    font-family:"Cormorant Garamond", serif;
    color:#5b4334;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(
            circle,
            transparent 45%,
            rgba(0,0,0,.22) 100%
        );
    pointer-events:none;
}

/* Name in top-left corner */
.name{
    position:fixed;
    top:22px;
    left:28px;
    z-index:10;

    font-family:"Pinyon Script", cursive;
    font-size:1.7rem;
    color:#fff3d2;
    opacity:.9;

    text-shadow:
        1px 1px 3px rgba(70,45,20,.3);
}

.wrapper{
    width:min(1200px,95%);
    margin:auto;
    padding:70px 0 120px;
}

.page-title{
    font-family:"Pinyon Script", cursive;
    font-size:clamp(5rem,10vw,9rem);
    font-weight:400;
    text-align:center;
    margin-bottom:10px;

    background:linear-gradient(
        to bottom,
        #fff8d6 0%,
        #ffe88a 18%,
        #f3cf58 38%,
        #c89a2b 55%,
        #fff0a8 72%,
        #a97816 100%
    );

    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
        0 -1px 0 rgba(255,255,220,.9),
        1px 1px 2px rgba(212,169,58,.45),
        2px 2px 4px rgba(193,141,34,.25),
        0 0 10px rgba(255,230,120,.55),
        0 0 24px rgba(255,220,90,.35),
        0 0 50px rgba(255,210,90,.18),
        4px 4px 10px rgba(0,0,0,.18);

    transform:rotate(-1deg);
}

.subtitle{
    text-align:center;
    color:#f5ead1;
    font-family:"Courier New", monospace;
    letter-spacing:3px;
    font-size:.85rem;
    text-transform:uppercase;
    margin-bottom:20px;
}

.glossary{
    width:min(1300px,92%);
    margin:auto;
    padding:50px 0 100px;

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:55px;
}

.fortune{
    position:relative;
    width:260px;
    display:block;
    text-decoration:none;
    color:inherit;
    cursor:pointer;
    transition:.3s ease;
}

.fortune:hover{
    transform:translateY(-6px) rotate(0deg) !important;
}

.fortune:visited{
    color:inherit;
}

.fortune img{
    width:100%;
    display:block;
    filter:drop-shadow(0 8px 18px rgba(70,45,20,.12));
}

.fortune-text{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:72%;
    text-align:center;
    color:#303D6B;
}

.fortune-text h2{
    font-size:1rem;
    font-weight:normal;
    color:#303D6B;
    margin-bottom:12px;
}

.fortune-text p{
    font-size:.75rem;
    line-height:1;
}

.fortune:nth-child(odd){
    transform:rotate(-2deg);
}

.fortune:nth-child(even){
    transform:rotate(2deg);
}

.fortune:nth-child(3n){
    transform:rotate(-4deg);
}

.fortune:nth-child(5n){
    transform:rotate(1deg);
}

</style>
</head>

<body>

<div class="name">Mimi Harrison</div>

<div class="wrapper">

<h1 class="page-title">
summer poetry

</div>

    </div>
</a>
